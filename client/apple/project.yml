# XcodeGen spec for Aevora on macOS AND iOS. Both platforms share the same
# SwiftUI sources and the same packet-tunnel extension; only entitlements and
# deployment targets differ. The Rust core (aevora-core) is shared via the
# AevoraCore.xcframework, which includes macOS + iOS + iOS-simulator slices.
#
# Generate:  xcodegen generate     (brew install xcodegen)
# Prereq:    ./build-core.sh        (xcframework + Swift bindings)
#
# Set DEVELOPMENT_TEAM + AEVORA_CONTROL_URL below (or in an untracked xcconfig);
# do not commit signing identities.

name: Aevora
options:
  bundleIdPrefix: com.aevora
  deploymentTarget:
    macOS: "14.0"   # WorldMapView uses the SwiftUI Map content builder
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""            # your 10-char Apple Team ID
    AEVORA_CONTROL_URL: ""         # e.g. https://control.example.com
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

packages:
  WireGuardKit:
    url: https://github.com/WireGuard/wireguard-apple.git
    branch: master

targets:
  # ---------------- macOS ----------------
  Aevora-macOS:
    type: application
    platform: macOS
    sources: [Aevora, Shared, build/Generated]
    settings:
      base:
        PRODUCT_NAME: Aevora
        PRODUCT_BUNDLE_IDENTIFIER: com.aevora.Aevora
        INFOPLIST_FILE: Aevora/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aevora/Aevora.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - framework: build/AevoraCore.xcframework
        embed: false
      - target: PacketTunnel-macOS

  PacketTunnel-macOS:
    type: app-extension
    platform: macOS
    sources: [PacketTunnel, Shared, build/Generated]
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.aevora.Aevora.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - framework: build/AevoraCore.xcframework
        embed: false
      - package: WireGuardKit
        product: WireGuardKit

  # ---------------- iOS ----------------
  Aevora-iOS:
    type: application
    platform: iOS
    sources: [Aevora, Shared, build/Generated]
    settings:
      base:
        PRODUCT_NAME: Aevora
        PRODUCT_BUNDLE_IDENTIFIER: com.aevora.Aevora
        INFOPLIST_FILE: Aevora/Info.plist
        CODE_SIGN_ENTITLEMENTS: Aevora/Aevora-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - framework: build/AevoraCore.xcframework
        embed: false
      - target: PacketTunnel-iOS

  PacketTunnel-iOS:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel, Shared, build/Generated]
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.aevora.Aevora.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel-iOS.entitlements
    dependencies:
      - framework: build/AevoraCore.xcframework
        embed: false
      - package: WireGuardKit
        product: WireGuardKit
