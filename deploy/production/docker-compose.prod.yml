# Aevora production stack: PostgreSQL + control plane + Caddy (TLS reverse proxy).
#
#   cp .env.prod.example .env   # fill in secrets (see the file)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy terminates TLS (auto Let's Encrypt) and forwards to controld, which runs
# with AEVORA_TRUST_PROXY=true so rate limiting keys on the real client IP.
# controld is NOT published to the host — only Caddy is public.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aevora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aevora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevora"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data

  controld:
    build:
      context: ../../control-plane
    restart: unless-stopped
    environment:
      AEVORA_LISTEN_ADDR: ":8080"
      AEVORA_DB_URL: "postgres://aevora:${POSTGRES_PASSWORD}@postgres:5432/aevora?sslmode=disable"
      AEVORA_JWT_SECRET: ${AEVORA_JWT_SECRET:?set AEVORA_JWT_SECRET in .env}
      AEVORA_ENROLLMENT_SECRET: ${AEVORA_ENROLLMENT_SECRET:?set AEVORA_ENROLLMENT_SECRET in .env}
      AEVORA_ADMIN_TOKEN: ${AEVORA_ADMIN_TOKEN:?set AEVORA_ADMIN_TOKEN in .env}
      AEVORA_TRUST_PROXY: "true"
      AEVORA_CLIENT_DNS: ${AEVORA_CLIENT_DNS:-9.9.9.9,149.112.112.112}
      # AEVORA_DEV_SEED is intentionally unset in production.
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AEVORA_DOMAIN: ${AEVORA_DOMAIN:?set AEVORA_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - controld

volumes:
  pgdata:
  caddydata:
  caddyconfig:
